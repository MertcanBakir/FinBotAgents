name: Update PR version

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: version-pr-${{ github.event.pull_request.number }}
  queue: max

jobs:
  version:
    # Never use elevated credentials on external PR code or branches.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.VERSIONING_APP_CLIENT_ID }}
          private-key: ${{ secrets.VERSIONING_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - name: Update PR files using the trusted base script
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 deploy/personal/auto_version.py update
